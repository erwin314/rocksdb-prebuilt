[package]
name = "rocksdb-prebuilt-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
license = "Apache-2.0"
repository = "https://github.com/erwin314/rocksdb-prebuilt"
description = "Static C++20 archive builder for prebuilt RocksDB releases."

[features]
default = []
checked-status = []

[dependencies]
lz4-sys = "1.11.1"
zstd-sys = "2.1.3"

[build-dependencies]
cc = { version = "1.11", features = ["parallel"] }

[profile.release]
opt-level = 3
debug = false
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
