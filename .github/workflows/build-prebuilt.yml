name: Build Prebuilt RocksDB

on:
  workflow_dispatch:
    inputs:
      rocksdb_version:
        description: Upstream RocksDB version (e.g. 11.8.1, 11.12, or 11.13.2)
        type: string
        required: true
      publish_release:
        description: Create or update GitHub Release v<version> with built tarballs
        type: boolean
        required: true
        default: true
      include_linux_x64:
        description: Build Linux x86_64 (x86_64-unknown-linux-gnu)
        type: boolean
        required: true
        default: true
      include_linux_arm64:
        description: Build Linux ARM64 (aarch64-unknown-linux-gnu)
        type: boolean
        required: true
        default: false
      include_macos_arm64:
        description: Build macOS Apple Silicon (aarch64-apple-darwin)
        type: boolean
        required: true
        default: false
      include_windows_x64:
        description: Build Windows x86_64 MSVC (x86_64-pc-windows-msvc)
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      releases_json:
        description: JSON array of release objects ({version, release_tag, upstream_tag})
        type: string
        required: true
      matrix_json:
        description: JSON array of build matrix entries ({version, release_tag, upstream_tag, target, os})
        type: string
        required: true
      publish_release:
        description: Create or update GitHub Release v<version> with built tarballs
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  plan-matrix:
    name: Validate Version & Plan Matrix
    runs-on: ubuntu-26.04
    outputs:
      releases_json: ${{ steps.plan.outputs.releases_json }}
      matrix_json: ${{ steps.plan.outputs.matrix_json }}
    steps:
      - id: plan
        env:
          CALL_RELEASES_JSON: ${{ inputs.releases_json }}
          CALL_MATRIX_JSON: ${{ inputs.matrix_json }}
          INPUT_VERSION: ${{ inputs.rocksdb_version }}
          INCLUDE_LINUX_X64: ${{ inputs.include_linux_x64 }}
          INCLUDE_LINUX_ARM64: ${{ inputs.include_linux_arm64 }}
          INCLUDE_MACOS_ARM64: ${{ inputs.include_macos_arm64 }}
          INCLUDE_WINDOWS_X64: ${{ inputs.include_windows_x64 }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          ALLOWED_RUNNERS = {
              "x86_64-unknown-linux-gnu": "ubuntu-24.04",
              "aarch64-unknown-linux-gnu": "ubuntu-24.04-arm",
              "aarch64-apple-darwin": "macos-15",
              "x86_64-pc-windows-msvc": "windows-2025",
          }
          CANONICAL_VERSION_RE = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+$")
          TWO_PART_VERSION_RE = re.compile(r"^[0-9]+\.[0-9]+$")
          UPSTREAM_TAG_RE = re.compile(r"^v[0-9]+\.[0-9]+(?:\.[0-9]+)?$")

          call_releases_raw = os.environ.get("CALL_RELEASES_JSON", "").strip()
          call_matrix_raw = os.environ.get("CALL_MATRIX_JSON", "").strip()
          if call_releases_raw or call_matrix_raw:
              releases = json.loads(call_releases_raw)
              matrix = json.loads(call_matrix_raw)

              if not isinstance(releases, list) or not releases:
                  print("ERROR: releases_json must be a non-empty JSON array", file=sys.stderr)
                  sys.exit(1)
              if not isinstance(matrix, list) or not matrix:
                  print("ERROR: matrix_json must be a non-empty JSON array", file=sys.stderr)
                  sys.exit(1)

              release_keys = set()
              for rel in releases:
                  if not isinstance(rel, dict):
                      print("ERROR: release entry must be an object", file=sys.stderr)
                      sys.exit(1)
                  version = rel.get("version", "")
                  release_tag = rel.get("release_tag", "")
                  upstream_tag = rel.get("upstream_tag", "")
                  if not CANONICAL_VERSION_RE.fullmatch(version):
                      print(f"ERROR: invalid version in releases_json: {version!r}", file=sys.stderr)
                      sys.exit(1)
                  if release_tag != f"v{version}":
                      print(f"ERROR: invalid release_tag {release_tag!r} for version {version!r}", file=sys.stderr)
                      sys.exit(1)
                  if not UPSTREAM_TAG_RE.fullmatch(upstream_tag):
                      print(f"ERROR: invalid upstream_tag {upstream_tag!r}", file=sys.stderr)
                      sys.exit(1)
                  release_keys.add((version, release_tag, upstream_tag))

              for item in matrix:
                  if not isinstance(item, dict):
                      print("ERROR: matrix entry must be an object", file=sys.stderr)
                      sys.exit(1)
                  key = (
                      item.get("version", ""),
                      item.get("release_tag", ""),
                      item.get("upstream_tag", ""),
                  )
                  if key not in release_keys:
                      print(f"ERROR: matrix entry release {key!r} not found in releases_json", file=sys.stderr)
                      sys.exit(1)
                  target = item.get("target", "")
                  os_name = item.get("os", "")
                  if ALLOWED_RUNNERS.get(target) != os_name:
                      print(f"ERROR: invalid (target, os) pair: {(target, os_name)!r}", file=sys.stderr)
                      sys.exit(1)
          else:
              raw_version = os.environ.get("INPUT_VERSION", "").strip()
              version = raw_version[1:] if raw_version.startswith("v") else raw_version
              if TWO_PART_VERSION_RE.fullmatch(version):
                  version = f"{version}.0"
              if not CANONICAL_VERSION_RE.fullmatch(version):
                  print(
                      f"ERROR: rocksdb_version must be MAJOR.MINOR.PATCH or MAJOR.MINOR (got {raw_version!r})",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              candidate_tags = [f"v{version}"]
              if version.endswith(".0"):
                  candidate_tags.append(f"v{version[:-2]}")

              upstream_tag = None
              for candidate in candidate_tags:
                  res = subprocess.run(
                      [
                          "git",
                          "ls-remote",
                          "--exit-code",
                          "--tags",
                          "https://github.com/meta/rocksdb.git",
                          f"refs/tags/{candidate}",
                      ],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if res.returncode == 0:
                      upstream_tag = candidate
                      break

              if upstream_tag is None:
                  print(
                      f"ERROR: upstream tag not found in https://github.com/meta/rocksdb.git (tried {', '.join(candidate_tags)})",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              release_tag = f"v{version}"
              releases = [
                  {
                      "version": version,
                      "release_tag": release_tag,
                      "upstream_tag": upstream_tag,
                  }
              ]

              selected = []
              if os.environ.get("INCLUDE_LINUX_X64") == "true":
                  selected.append("x86_64-unknown-linux-gnu")
              if os.environ.get("INCLUDE_LINUX_ARM64") == "true":
                  selected.append("aarch64-unknown-linux-gnu")
              if os.environ.get("INCLUDE_MACOS_ARM64") == "true":
                  selected.append("aarch64-apple-darwin")
              if os.environ.get("INCLUDE_WINDOWS_X64") == "true":
                  selected.append("x86_64-pc-windows-msvc")

              if not selected:
                  print("ERROR: select at least one target platform to build", file=sys.stderr)
                  sys.exit(1)

              matrix = [
                  {
                      "version": version,
                      "release_tag": release_tag,
                      "upstream_tag": upstream_tag,
                      "target": target,
                      "os": ALLOWED_RUNNERS[target],
                  }
                  for target in selected
              ]

          releases_json = json.dumps(releases, separators=(",", ":"))
          matrix_json = json.dumps(matrix, separators=(",", ":"))
          print(f"Planned releases: {releases_json}")
          print(f"Planned matrix: {matrix_json}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"releases_json={releases_json}\n")
              fh.write(f"matrix_json={matrix_json}\n")
          PY

  prepare-release:
    name: Ensure GitHub Releases
    needs: plan-matrix
    if: inputs.publish_release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create Releases if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_JSON: ${{ needs.plan-matrix.outputs.releases_json }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          releases = json.loads(os.environ["RELEASES_JSON"])
          target_sha = os.environ["TARGET_SHA"]

          for rel in releases:
              release_tag = rel["release_tag"]
              view = subprocess.run(
                  ["gh", "release", "view", release_tag],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if view.returncode == 0:
                  print(f"Release {release_tag} already exists.")
                  continue

              print(f"Creating release {release_tag} at {target_sha}...")
              subprocess.run(
                  [
                      "gh",
                      "release",
                      "create",
                      release_tag,
                      "--target",
                      target_sha,
                      "--title",
                      f"RocksDB {release_tag}",
                      "--notes",
                      f"Prebuilt static C++20 librocksdb.a archives for upstream RocksDB {release_tag} (ndebug and checked-status variants).",
                  ],
                  check=True,
              )
          PY

  build:
    name: Build v${{ matrix.version }} (${{ matrix.target }} on ${{ matrix.os }})
    needs: [plan-matrix, prepare-release]
    if: always() && needs.plan-matrix.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan-matrix.outputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache upstream RocksDB source
        uses: actions/cache@v6
        with:
          path: ~/.cache/rocksdb-prebuilt/src
          key: rocksdb-src-${{ matrix.release_tag }}

      - name: Build prebuilt RocksDB tarballs
        env:
          ROCKSDB_VERSION: ${{ matrix.version }}
          UPSTREAM_TAG: ${{ matrix.upstream_tag }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            export MACOSX_DEPLOYMENT_TARGET="13.0"
          fi
          ./scripts/build_prebuilt.sh \
            --version "${ROCKSDB_VERSION}" \
            --upstream-tag "${UPSTREAM_TAG}" \
            --target "${MATRIX_TARGET}" \
            --out-dir "${RUNNER_TEMP}/prebuilt-dist"

      - name: Verify prebuilt tarball layout and metadata
        env:
          ROCKSDB_VERSION: ${{ matrix.version }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          DIST_DIR="${RUNNER_TEMP}/prebuilt-dist"
          WORK_VERIFY="${RUNNER_TEMP}/verify"
          if command -v cygpath >/dev/null 2>&1; then
            DIST_DIR="$(cygpath -u "${DIST_DIR}")"
            WORK_VERIFY="$(cygpath -u "${WORK_VERIFY}")"
          fi
          EXPECTED_NS="rocksdb_v${ROCKSDB_VERSION//./_}"

          {
            echo "### Prebuilt RocksDB Archives v${ROCKSDB_VERSION} (${MATRIX_TARGET})"
            echo ""
            echo "| Variant | Archive | Size (bytes) |"
            echo "| :--- | :--- | ---: |"
          } >> "${GITHUB_STEP_SUMMARY}"

          for variant in ndebug checked-status; do
            ARCHIVE="rocksdb-v${ROCKSDB_VERSION}-${MATRIX_TARGET}-${variant}.tar.gz"
            ARCHIVE_PATH="${DIST_DIR}/${ARCHIVE}"
            [[ -s "${ARCHIVE_PATH}" ]]

            EXTRACT_DIR="${WORK_VERIFY}/${variant}"
            rm -rf -- "${EXTRACT_DIR}"
            mkdir -p "${EXTRACT_DIR}"
            tar -xzf "${ARCHIVE_PATH}" -C "${EXTRACT_DIR}"

            [[ -s "${EXTRACT_DIR}/lib/librocksdb.a" ]]
            [[ -f "${EXTRACT_DIR}/include/rocksdb/version.h" ]]
            [[ -f "${EXTRACT_DIR}/port/stack_trace.h" ]]
            [[ -f "${EXTRACT_DIR}/LICENSE.Apache" ]]
            [[ -f "${EXTRACT_DIR}/COPYING" ]]
            grep -qx "rocksdb_version=${ROCKSDB_VERSION}" "${EXTRACT_DIR}/build-info.env"
            grep -qx "namespace=${EXPECTED_NS}" "${EXTRACT_DIR}/build-info.env"
            grep -qx "target=${MATRIX_TARGET}" "${EXTRACT_DIR}/build-info.env"
            grep -qx "status_abi=${variant}" "${EXTRACT_DIR}/build-info.env"
            grep -qE '^cxx_defines=.+' "${EXTRACT_DIR}/build-info.env"

            SIZE_BYTES="$(wc -c < "${ARCHIVE_PATH}" | tr -d ' ')"
            echo "| \`${variant}\` | \`${ARCHIVE}\` | ${SIZE_BYTES} |" >> "${GITHUB_STEP_SUMMARY}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt-v${{ matrix.version }}-${{ matrix.target }}
          path: ${{ runner.temp }}/prebuilt-dist/*.tar.gz

      - name: Upload tarballs to GitHub Release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          DIST_DIR="${RUNNER_TEMP}/prebuilt-dist"
          if command -v cygpath >/dev/null 2>&1; then
            DIST_DIR="$(cygpath -u "${DIST_DIR}")"
          fi
          gh release upload "${RELEASE_TAG}" "${DIST_DIR}"/*.tar.gz --clobber
